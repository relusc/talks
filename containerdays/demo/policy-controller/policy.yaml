apiVersion: policy.sigstore.dev/v1alpha1
kind: ClusterImagePolicy
metadata:
  name: cosign-validate-signature
spec:
  images:
    # Match all images
    # Namespace still needs to be labeled so that the policy applies to it: https://docs.sigstore.dev/policy-controller/overview/
    - glob: "**"
  authorities:
    # Verify using identity/subject -> keyless signing
    - keyless:
        identities:
          - subject: "https://github.com/relusc/talks/.github/workflows/containerdays-build-push-sample-app.yaml@refs/heads/main"
            issuer: "https://token.actions.githubusercontent.com"
  signatureFormat: bundle
  attestations:
    - name: require-attestation
      predicateType: https://slsa.dev/provenance/v1
