kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cd-demo
nodes:
- role: control-plane
- role: worker
  labels:
    type: wasm
- role: worker
  labels:
    type: container
- role: worker
  labels:
    type: registry
  extraPortMappings:
  - containerPort: 30950
    hostPort: 5000
containerdConfigPatches:
  - |-
    [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.wasmtime]
      runtime_type = "io.containerd.wasmtime.v1"
    [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.spin]
      runtime_type = "io.containerd.spin.v2"
    [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.spin.options]
      SystemdCgroup = true
