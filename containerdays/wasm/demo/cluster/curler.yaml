apiVersion: v1
kind: Pod
metadata:
  name: curler
  labels:
    app: curler
spec:
  terminationGracePeriodSeconds: 0
  containers:
    - name: curl
      image: alpine/curl:latest
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
