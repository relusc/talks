apiVersion: apps/v1
kind: Deployment
metadata:
  name: container-webserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: container-webserver
  template:
    metadata:
      labels:
        app: container-webserver
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: container-webserver
          image: registry.local:5000/sample-app-container:3d54a83
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
