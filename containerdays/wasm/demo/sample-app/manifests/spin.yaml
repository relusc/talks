apiVersion: core.spinkube.dev/v1alpha1
kind: SpinApp
metadata:
  name: wasm-webserver
spec:
  image: registry.local:5000/sample-app-wasm:849a371
  replicas: 1
  executor: containerd-shim-spin
  checks:
    readiness:
      httpGet:
        path: /healthz
        httpHeaders:
          - name: X-Conference-Name
            value: ContainerDays
