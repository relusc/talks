# Project-local wkg config, used via `wkg wit fetch --config .wkg/config.toml`.
#
# Note: once you point wkg at a config file at all, it stops applying its
# built-in fallback namespace mappings (wasi -> wasi.dev, ba ->
# bytecodealliance.org) and uses only what's listed here — so every
# namespace our WIT world touches has to be spelled out explicitly,
# including "wasi", even though wkg would resolve it for free with no
# --config flag at all.
[namespace_registries]
# Built-in default, restated explicitly (see note above).
wasi = "wasi.dev"
# wasmcloud:* isn't in wkg's built-in defaults (only `wash` knows about it).
# Packages are published as OCI artifacts under ghcr.io/wasmcloud/interfaces/,
# e.g. wasmcloud:component-go -> ghcr.io/wasmcloud/interfaces/component-go.
wasmcloud = { registry = "wasmcloud", metadata = { preferredProtocol = "oci", "oci" = { registry = "ghcr.io", namespacePrefix = "wasmcloud/interfaces/" } } }
